services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app_net

  app:
    build: .
    container_name: node_app
    restart: always
    ports:
      - "${PORT}:3000"
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - .:/usr/src/app
    networks:
      - app_net
    command: sh -c "npm install && npm run dev"

volumes:
  db_data:

networks:
  app_net:
    driver: bridge
